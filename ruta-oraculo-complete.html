<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>🔮 Ruta Oráculo - Compara precios de transporte</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Configuración de servicios por país
    const servicesConfig = {
      colombia: {
        currency: 'COP',
        baseDistance: 5,
        transport: [
          { name: 'taxi', displayName: 'Taxi', color: '#FFC107', types: [{ name: 'Taxi', basePrice: 5000, pricePerKm: 1300, eta: 8 }] },
          { name: 'uber', displayName: 'Uber', color: '#000000', types: [
            { name: 'UberX', basePrice: 4000, pricePerKm: 1000, eta: 10 },
            { name: 'Comfort', basePrice: 5000, pricePerKm: 1200, eta: 8 },
            { name: 'UberXL', basePrice: 6000, pricePerKm: 1500, eta: 15 }
          ]},
          { name: 'didi', displayName: 'DiDi', color: '#FF6600', types: [
            { name: 'Express', basePrice: 3800, pricePerKm: 900, eta: 12 },
            { name: 'Comfort', basePrice: 4500, pricePerKm: 1100, eta: 10 }
          ]},
          { name: 'cabify', displayName: 'Cabify', color: '#6B2C91', types: [
            { name: 'Lite', basePrice: 4000, pricePerKm: 1000, eta: 9 },
            { name: 'Executive', basePrice: 6000, pricePerKm: 1400, eta: 7 }
          ]},
          { name: 'indrive', displayName: 'inDrive', color: '#1DCC70', types: [
            { name: 'Economy', basePrice: 3500, pricePerKm: 850, eta: 13 },
            { name: 'Standard', basePrice: 4200, pricePerKm: 1000, eta: 11 }
          ]},
          { name: 'yango', displayName: 'Yango', color: '#FC3F1D', types: [
            { name: 'Economy', basePrice: 3600, pricePerKm: 880, eta: 12 },
            { name: 'Comfort', basePrice: 4300, pricePerKm: 1050, eta: 10 }
          ]}
        ]
      },
      mexico: {
        currency: 'MXN',
        baseDistance: 5,
        transport: [
          { name: 'taxi', displayName: 'Taxi', color: '#FFC107', types: [{ name: 'Taxi', basePrice: 50, pricePerKm: 15, eta: 8 }] },
          { name: 'uber', displayName: 'Uber', color: '#000000', types: [
            { name: 'UberX', basePrice: 40, pricePerKm: 12, eta: 10 },
            { name: 'Comfort', basePrice: 55, pricePerKm: 15, eta: 8 }
          ]},
          { name: 'didi', displayName: 'DiDi', color: '#FF6600', types: [
            { name: 'Express', basePrice: 38, pricePerKm: 11, eta: 12 }
          ]},
          { name: 'cabify', displayName: 'Cabify', color: '#6B2C91', types: [
            { name: 'Lite', basePrice: 40, pricePerKm: 12, eta: 9 }
          ]},
          { name: 'indrive', displayName: 'inDrive', color: '#1DCC70', types: [
            { name: 'Economy', basePrice: 35, pricePerKm: 10, eta: 13 }
          ]},
          { name: 'yango', displayName: 'Yango', color: '#FC3F1D', types: [
            { name: 'Economy', basePrice: 36, pricePerKm: 10.5, eta: 12 }
          ]}
        ]
      },
      peru: {
        currency: 'PEN',
        baseDistance: 5,
        transport: [
          { name: 'taxi', displayName: 'Taxi', color: '#FFC107', types: [{ name: 'Taxi', basePrice: 8, pricePerKm: 2.5, eta: 8 }] },
          { name: 'uber', displayName: 'Uber', color: '#000000', types: [
            { name: 'UberX', basePrice: 6, pricePerKm: 2, eta: 10 }
          ]},
          { name: 'didi', displayName: 'DiDi', color: '#FF6600', types: [
            { name: 'Express', basePrice: 5.5, pricePerKm: 1.8, eta: 12 }
          ]},
          { name: 'cabify', displayName: 'Cabify', color: '#6B2C91', types: [
            { name: 'Lite', basePrice: 6, pricePerKm: 2, eta: 9 }
          ]},
          { name: 'indrive', displayName: 'inDrive', color: '#1DCC70', types: [
            { name: 'Economy', basePrice: 5, pricePerKm: 1.7, eta: 13 }
          ]},
          { name: 'yango', displayName: 'Yango', color: '#FC3F1D', types: [
            { name: 'Economy', basePrice: 5.2, pricePerKm: 1.75, eta: 12 }
          ]}
        ]
      }
    };

    // POIs por ciudad
    const commonAddresses = {
      colombia: {
        'Bogotá': [
          'Aeropuerto El Dorado',
          'Terminal de Transporte Bogotá',
          'Centro Comercial Andino',
          'Centro Comercial Unicentro',
          'Zona T, Bogotá',
          'Parque 93',
          'Usaquén',
          'Chapinero',
          'Monserrate',
          'Museo del Oro',
          'Plaza de Bolívar',
          'La Candelaria',
          'Universidad de los Andes',
          'Universidad Nacional',
          'Hospital El Country',
          'Estadio El Campín'
        ]
      },
      mexico: {
        'CDMX': [
          'Aeropuerto Internacional CDMX',
          'Terminal Central del Norte',
          'Ángel de la Independencia',
          'Palacio de Bellas Artes',
          'Zócalo CDMX',
          'Polanco',
          'Condesa',
          'Roma Norte',
          'Santa Fe',
          'Centro Histórico CDMX',
          'Museo Nacional de Antropología',
          'Chapultepec',
          'Universidad Nacional Autónoma de México (UNAM)',
          'Estadio Azteca'
        ]
      },
      peru: {
        'Lima': [
          'Aeropuerto Jorge Chávez',
          'Larcomar, Miraflores',
          'Jockey Plaza',
          'Miraflores',
          'San Isidro',
          'Barranco',
          'Plaza de Armas Lima',
          'Parque Kennedy',
          'Costa Verde',
          'Universidad Católica (PUCP)',
          'Real Plaza'
        ]
      }
    };

    function App() {
      // Estados principales
      const [country, setCountry] = useState('colombia');
      const [origin, setOrigin] = useState('');
      const [destination, setDestination] = useState('');
      const [distance, setDistance] = useState(null);
      const [sortBy, setSortBy] = useState('default');

      // Usuario y sesión
      const [currentUser, setCurrentUser] = useState(null);
      const [showLogin, setShowLogin] = useState(false);
      const [showProfile, setShowProfile] = useState(false);
      const [userName, setUserName] = useState('');
      const [userEmail, setUserEmail] = useState('');

      // Historial y favoritos
      const [history, setHistory] = useState([]);
      const [favorites, setFavorites] = useState([]);

      // Sugerencias
      const [originSuggestions, setOriginSuggestions] = useState([]);
      const [destSuggestions, setDestSuggestions] = useState([]);
      const [showOriginSugg, setShowOriginSugg] = useState(false);
      const [showDestSugg, setShowDestSugg] = useState(false);

      // Chat
      const [showChat, setShowChat] = useState(false);
      const [chatMessages, setChatMessages] = useState([{role: 'assistant', content: '¡Hola! Soy tu asistente de rutas. ¿A dónde quieres ir hoy?'}]);
      const [chatInput, setChatInput] = useState('');

      // Cargar usuario desde localStorage
      useEffect(() => {
        try {
          const savedUser = localStorage.getItem('rutaOraculoUser');
          if (savedUser) {
            const user = JSON.parse(savedUser);
            setCurrentUser(user);

            // Cargar historial y favoritos
            const savedHistory = localStorage.getItem(`history_${user.id}`);
            if (savedHistory) setHistory(JSON.parse(savedHistory));

            const savedFavorites = localStorage.getItem(`favorites_${user.id}`);
            if (savedFavorites) setFavorites(JSON.parse(savedFavorites));
          }
        } catch (e) {
          console.error('Error loading user:', e);
        }
      }, []);

      // Función de búsqueda de sugerencias
      const searchSuggestions = (value, isOrigin) => {
        if (!value || value.length < 2) {
          if (isOrigin) {
            setOriginSuggestions([]);
            setShowOriginSugg(false);
          } else {
            setDestSuggestions([]);
            setShowDestSugg(false);
          }
          return;
        }

        const lowerValue = value.toLowerCase();
        const addresses = Object.values(commonAddresses[country] || {}).flat();
        const filtered = addresses.filter(addr =>
          addr.toLowerCase().includes(lowerValue)
        ).slice(0, 8);

        if (isOrigin) {
          setOriginSuggestions(filtered);
          setShowOriginSugg(true);
        } else {
          setDestSuggestions(filtered);
          setShowDestSugg(true);
        }
      };

      // Calcular distancia
      const calculateRoute = () => {
        if (!origin || !destination) return;

        const baseDistance = servicesConfig[country].baseDistance;
        const randomVar = Math.random() * 5 + 3;
        const calculatedDistance = baseDistance + randomVar;
        setDistance(calculatedDistance);

        // Guardar en historial si está logueado
        if (currentUser) {
          const newRoute = {
            id: Date.now(),
            from: origin,
            to: destination,
            country,
            timestamp: new Date().toISOString(),
            timesUsed: 1
          };

          const updatedHistory = [newRoute, ...history].slice(0, 20);
          setHistory(updatedHistory);
          localStorage.setItem(`history_${currentUser.id}`, JSON.stringify(updatedHistory));
        }
      };

      // Obtener tráfico actual
      const getTraffic = () => {
        const hour = new Date().getHours();
        if ((hour >= 6 && hour <= 9) || (hour >= 17 && hour <= 20)) {
          return { multiplier: 1.4, text: 'Tráfico alto', color: '#FEE2E2', textColor: '#DC2626' };
        }
        if (hour >= 9 && hour <= 17) {
          return { multiplier: 1.15, text: 'Tráfico moderado', color: '#FEF3C7', textColor: '#D97706' };
        }
        return { multiplier: 1.0, text: 'Tráfico fluido', color: '#D1FAE5', textColor: '#059669' };
      };

      // Calcular precio
      const calculatePrice = (service, type) => {
        if (!distance) return null;
        const traffic = getTraffic();
        const base = type.basePrice + (type.pricePerKm * distance);
        return Math.round(base * traffic.multiplier);
      };

      // Calcular ETA
      const calculateEta = (type) => {
        if (!distance) return type.eta;
        const traffic = getTraffic();
        const baseTime = distance * 3;
        return Math.round((baseTime + type.eta) * traffic.multiplier);
      };

      // Construir resultados
      const results = useMemo(() => {
        if (!distance) return [];

        const services = servicesConfig[country].transport;
        const allResults = [];

        services.forEach(service => {
          service.types.forEach(type => {
            allResults.push({
              serviceName: service.name,
              displayName: service.displayName,
              typeName: type.name,
              color: service.color,
              price: calculatePrice(service, type),
              eta: calculateEta(type)
            });
          });
        });

        return allResults;
      }, [country, distance]);

      // Ordenar resultados
      const sortedResults = useMemo(() => {
        if (!results.length) return [];

        let sorted = [...results];

        switch (sortBy) {
          case 'price-asc':
            sorted.sort((a, b) => a.price - b.price);
            break;
          case 'time-asc':
            sorted.sort((a, b) => a.eta - b.eta);
            break;
          case 'for-me':
            if (currentUser) {
              // Ordenar por preferencias del usuario
              sorted.sort((a, b) => {
                const aCount = currentUser.bookingCount?.[a.serviceName] || 0;
                const bCount = currentUser.bookingCount?.[b.serviceName] || 0;
                if (aCount !== bCount) return bCount - aCount;
                return (a.price * 0.6 + a.eta * 0.4) - (b.price * 0.6 + b.eta * 0.4);
              });
            }
            break;
        }

        return sorted;
      }, [results, sortBy, currentUser]);

      // Login
      const handleLogin = () => {
        if (!userEmail) {
          alert('Por favor ingresa tu email');
          return;
        }

        const newUser = {
          id: `user_${Date.now()}`,
          name: userName || 'Usuario',
          email: userEmail,
          createdAt: new Date().toISOString(),
          bookingCount: {}
        };

        setCurrentUser(newUser);
        localStorage.setItem('rutaOraculoUser', JSON.stringify(newUser));
        setShowLogin(false);
        setUserName('');
        setUserEmail('');
      };

      // Logout
      const handleLogout = () => {
        setCurrentUser(null);
        setHistory([]);
        setFavorites([]);
        localStorage.removeItem('rutaOraculoUser');
        setShowProfile(false);
      };

      // Toggle favorito
      const toggleFavorite = (route) => {
        const isFav = favorites.some(f => f.id === route.id);
        let updatedFavorites;

        if (isFav) {
          updatedFavorites = favorites.filter(f => f.id !== route.id);
        } else {
          updatedFavorites = [...favorites, route];
        }

        setFavorites(updatedFavorites);
        if (currentUser) {
          localStorage.setItem(`favorites_${currentUser.id}`, JSON.stringify(updatedFavorites));
        }
      };

      // Cargar ruta
      const loadRoute = (route) => {
        setOrigin(route.from);
        setDestination(route.to);
        setCountry(route.country);
        setDistance(null);
        setShowProfile(false);
        setTimeout(() => calculateRoute(), 200);
      };

      // Booking
      const handleBooking = (serviceName) => {
        if (currentUser) {
          const updated = {
            ...currentUser,
            bookingCount: {
              ...currentUser.bookingCount,
              [serviceName]: (currentUser.bookingCount[serviceName] || 0) + 1
            }
          };
          setCurrentUser(updated);
          localStorage.setItem('rutaOraculoUser', JSON.stringify(updated));
        }

        // Abrir deep link
        const links = {
          uber: 'https://m.uber.com/',
          didi: 'https://web.didiglobal.com/',
          cabify: 'https://cabify.com/',
          indrive: 'https://indrive.com/',
          yango: 'https://yango.com/',
          taxi: null
        };

        const link = links[serviceName];
        if (link) {
          window.open(link, '_blank');
        } else {
          alert('Llama un taxi local o usa una app de taxis de tu ciudad');
        }
      };

      // Obtener más barato y más rápido
      const getCheapest = () => results.length ? results.reduce((min, r) => r.price < min.price ? r : min) : null;
      const getFastest = () => results.length ? results.reduce((min, r) => r.eta < min.eta ? r : min) : null;

      return (
        <div style={{ minHeight: '100vh', paddingBottom: '80px' }}>
          {/* Header */}
          <div style={{ background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', padding: '20px', color: 'white', textAlign: 'center' }}>
            <h1 style={{ fontSize: '28px', fontWeight: '900', marginBottom: '8px' }}>🔮 Ruta Oráculo</h1>
            <p style={{ fontSize: '14px', opacity: 0.95 }}>Compara precios y tiempos de todas las apps de transporte</p>
          </div>

          {/* Banner de login */}
          {!currentUser && (
            <div style={{ background: '#FEF3C7', borderBottom: '3px solid #F59E0B', padding: '16px', textAlign: 'center' }}>
              <p style={{ fontSize: '14px', fontWeight: '700', color: '#92400E', marginBottom: '10px' }}>
                🔒 Inicia sesión para desbloquear historial, favoritos e insights personalizados
              </p>
              <button onClick={() => setShowLogin(true)} style={{ background: '#F59E0B', color: 'white', border: 'none', padding: '10px 20px', borderRadius: '999px', fontWeight: '900', cursor: 'pointer' }}>
                ✨ Iniciar sesión
              </button>
            </div>
          )}

          {/* Main Content */}
          <div style={{ maxWidth: '1200px', margin: '0 auto', padding: '20px' }}>

            {/* Selector de país */}
            <div style={{ marginBottom: '16px' }}>
              <label style={{ display: 'block', marginBottom: '8px', fontWeight: '700', color: 'white' }}>País</label>
              <select value={country} onChange={(e) => { setCountry(e.target.value); setDistance(null); }}
                style={{ width: '100%', padding: '12px', borderRadius: '10px', border: '2px solid white', fontSize: '16px', fontWeight: '700' }}>
                <option value="colombia">🇨🇴 Colombia</option>
                <option value="mexico">🇲🇽 México</option>
                <option value="peru">🇵🇪 Perú</option>
              </select>
            </div>

            {/* Origen */}
            <div style={{ marginBottom: '16px', position: 'relative' }}>
              <label style={{ display: 'block', marginBottom: '8px', fontWeight: '700', color: 'white' }}>📍 Origen</label>
              <input type="text" value={origin}
                onChange={(e) => { setOrigin(e.target.value); searchSuggestions(e.target.value, true); }}
                onFocus={() => origin.length >= 2 && setShowOriginSugg(true)}
                onBlur={() => setTimeout(() => setShowOriginSugg(false), 200)}
                placeholder="¿Desde dónde sales?"
                style={{ width: '100%', padding: '12px', borderRadius: '10px', border: '2px solid white', fontSize: '16px' }} />

              {showOriginSugg && originSuggestions.length > 0 && (
                <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, background: 'white', border: '2px solid #E5E7EB', borderRadius: '0 0 10px 10px', maxHeight: '200px', overflowY: 'auto', zIndex: 1000, boxShadow: '0 4px 6px rgba(0,0,0,0.1)' }}>
                  {originSuggestions.map((sugg, idx) => (
                    <div key={idx} onClick={() => { setOrigin(sugg); setShowOriginSugg(false); }}
                      style={{ padding: '10px', cursor: 'pointer', borderBottom: '1px solid #F3F4F6', fontWeight: '600' }}
                      onMouseEnter={(e) => e.currentTarget.style.background = '#F3F4F6'}
                      onMouseLeave={(e) => e.currentTarget.style.background = 'white'}>
                      📍 {sugg}
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Destino */}
            <div style={{ marginBottom: '16px', position: 'relative' }}>
              <label style={{ display: 'block', marginBottom: '8px', fontWeight: '700', color: 'white' }}>🎯 Destino</label>
              <input type="text" value={destination}
                onChange={(e) => { setDestination(e.target.value); searchSuggestions(e.target.value, false); }}
                onFocus={() => destination.length >= 2 && setShowDestSugg(true)}
                onBlur={() => setTimeout(() => setShowDestSugg(false), 200)}
                placeholder="¿A dónde vas?"
                style={{ width: '100%', padding: '12px', borderRadius: '10px', border: '2px solid white', fontSize: '16px' }} />

              {showDestSugg && destSuggestions.length > 0 && (
                <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, background: 'white', border: '2px solid #E5E7EB', borderRadius: '0 0 10px 10px', maxHeight: '200px', overflowY: 'auto', zIndex: 1000, boxShadow: '0 4px 6px rgba(0,0,0,0.1)' }}>
                  {destSuggestions.map((sugg, idx) => (
                    <div key={idx} onClick={() => { setDestination(sugg); setShowDestSugg(false); }}
                      style={{ padding: '10px', cursor: 'pointer', borderBottom: '1px solid #F3F4F6', fontWeight: '600' }}
                      onMouseEnter={(e) => e.currentTarget.style.background = '#F3F4F6'}
                      onMouseLeave={(e) => e.currentTarget.style.background = 'white'}>
                      🎯 {sugg}
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Botón calcular */}
            <button onClick={calculateRoute} disabled={!origin || !destination}
              style={{ width: '100%', padding: '14px', background: origin && destination ? '#10B981' : '#9CA3AF', color: 'white', border: 'none', borderRadius: '10px', fontSize: '18px', fontWeight: '900', cursor: origin && destination ? 'pointer' : 'not-allowed', marginBottom: '20px' }}>
              🔮 Calcular Ruta
            </button>

            {/* Info de distancia y tráfico */}
            {distance && (
              <div style={{ background: getTraffic().color, color: getTraffic().textColor, padding: '12px', borderRadius: '10px', marginBottom: '16px', textAlign: 'center', fontWeight: '700' }}>
                📏 Distancia: {distance.toFixed(1)} km • {getTraffic().text}
              </div>
            )}

            {/* Filtros */}
            {distance && sortedResults.length > 0 && (
              <div style={{ background: 'rgba(255,255,255,0.95)', padding: '16px', borderRadius: '10px', marginBottom: '20px', border: '2px solid #E5E7EB' }}>
                <div style={{ fontSize: '12px', fontWeight: '900', color: '#6B7280', marginBottom: '10px', textTransform: 'uppercase' }}>Ordenar por</div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(110px, 1fr))', gap: '8px' }}>
                  <button onClick={() => setSortBy('default')}
                    style={{ padding: '10px', borderRadius: '8px', border: sortBy === 'default' ? '2px solid #667eea' : '1px solid #E5E7EB', background: sortBy === 'default' ? '#667eea' : 'white', color: sortBy === 'default' ? 'white' : '#374151', fontWeight: '900', fontSize: '13px', cursor: 'pointer' }}>
                    Default
                  </button>
                  <button onClick={() => setSortBy('price-asc')}
                    style={{ padding: '10px', borderRadius: '8px', border: sortBy === 'price-asc' ? '2px solid #667eea' : '1px solid #E5E7EB', background: sortBy === 'price-asc' ? '#667eea' : 'white', color: sortBy === 'price-asc' ? 'white' : '#374151', fontWeight: '900', fontSize: '13px', cursor: 'pointer' }}>
                    Más barato
                  </button>
                  <button onClick={() => setSortBy('time-asc')}
                    style={{ padding: '10px', borderRadius: '8px', border: sortBy === 'time-asc' ? '2px solid #667eea' : '1px solid #E5E7EB', background: sortBy === 'time-asc' ? '#667eea' : 'white', color: sortBy === 'time-asc' ? 'white' : '#374151', fontWeight: '900', fontSize: '13px', cursor: 'pointer' }}>
                    Más rápido
                  </button>
                  {currentUser && (
                    <button onClick={() => setSortBy('for-me')}
                      style={{ padding: '10px', borderRadius: '8px', border: sortBy === 'for-me' ? '2px solid #667eea' : '1px solid #E5E7EB', background: sortBy === 'for-me' ? '#667eea' : 'white', color: sortBy === 'for-me' ? 'white' : '#374151', fontWeight: '900', fontSize: '13px', cursor: 'pointer' }}>
                      Para mí
                    </button>
                  )}
                </div>
              </div>
            )}

            {/* Resultados */}
            {sortedResults.length > 0 && (
              <div style={{ display: 'grid', gap: '14px' }}>
                {sortedResults.map((result, idx) => {
                  const cheapest = getCheapest();
                  const fastest = getFastest();
                  const isCheapest = cheapest && result.price === cheapest.price;
                  const isFastest = fastest && result.eta === fastest.eta;
                  const bookingCount = currentUser?.bookingCount?.[result.serviceName] || 0;

                  return (
                    <div key={idx} style={{ background: 'white', borderLeft: `5px solid ${result.color}`, borderRadius: '12px', padding: '16px', boxShadow: '0 2px 8px rgba(0,0,0,0.1)' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '12px' }}>
                        <div>
                          <h3 style={{ fontSize: '18px', fontWeight: '900', color: '#111827', marginBottom: '4px' }}>{result.displayName}</h3>
                          <p style={{ fontSize: '14px', color: '#6B7280', fontWeight: '600' }}>{result.typeName}</p>
                        </div>
                        <div style={{ textAlign: 'right' }}>
                          <p style={{ fontSize: '24px', fontWeight: '900', color: '#111827' }}>
                            {servicesConfig[country].currency} {result.price.toLocaleString()}
                          </p>
                          <p style={{ fontSize: '12px', color: '#6B7280', fontWeight: '600' }}>⏱️ {result.eta} min</p>
                        </div>
                      </div>

                      {/* Insights solo si está logueado */}
                      {currentUser && (
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px', marginBottom: '12px' }}>
                          {isCheapest && (
                            <span style={{ background: '#D1FAE5', color: '#059669', padding: '4px 10px', borderRadius: '999px', fontSize: '11px', fontWeight: '800' }}>
                              💰 Más barato ahora
                            </span>
                          )}
                          {isFastest && (
                            <span style={{ background: '#DBEAFE', color: '#1E40AF', padding: '4px 10px', borderRadius: '999px', fontSize: '11px', fontWeight: '800' }}>
                              ⚡ Más rápido ahora
                            </span>
                          )}
                          {bookingCount >= 4 && (
                            <span style={{ background: '#FEF3C7', color: '#92400E', padding: '4px 10px', borderRadius: '999px', fontSize: '11px', fontWeight: '800' }}>
                              ⭐ Usado {bookingCount}x
                            </span>
                          )}
                        </div>
                      )}

                      <button onClick={() => handleBooking(result.serviceName)}
                        style={{ width: '100%', padding: '12px', background: result.color, color: 'white', border: 'none', borderRadius: '8px', fontSize: '16px', fontWeight: '900', cursor: 'pointer' }}>
                        Reservar
                      </button>
                    </div>
                  );
                })}
              </div>
            )}

            {/* CTA para login después de calcular */}
            {!currentUser && distance && (
              <div style={{ background: '#EFF6FF', border: '2px solid #3B82F6', borderRadius: '12px', padding: '16px', marginTop: '20px', textAlign: 'center' }}>
                <p style={{ fontSize: '14px', fontWeight: '700', color: '#1E40AF', marginBottom: '12px' }}>
                  🔒 Inicia sesión para ver insights personalizados y guardar tus rutas favoritas
                </p>
                <button onClick={() => setShowLogin(true)}
                  style={{ background: '#3B82F6', color: 'white', border: 'none', padding: '10px 24px', borderRadius: '999px', fontWeight: '900', cursor: 'pointer' }}>
                  Iniciar sesión ahora
                </button>
              </div>
            )}
          </div>

          {/* Bottom Navigation */}
          <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, background: 'white', borderTop: '2px solid #E5E7EB', padding: '12px', display: 'flex', justifyContent: 'space-around', zIndex: 999 }}>
            <button onClick={() => setShowChat(true)}
              style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '4px', background: 'none', border: 'none', cursor: 'pointer', color: '#6B7280' }}>
              <span style={{ fontSize: '24px' }}>💬</span>
              <span style={{ fontSize: '11px', fontWeight: '700' }}>Asistente</span>
            </button>

            <button onClick={() => currentUser ? setShowProfile(true) : setShowLogin(true)}
              style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '4px', background: currentUser ? 'none' : '#3B82F6', border: 'none', cursor: 'pointer', color: currentUser ? '#6B7280' : 'white', padding: currentUser ? '0' : '8px 16px', borderRadius: currentUser ? '0' : '999px' }}>
              <span style={{ fontSize: '24px' }}>👤</span>
              <span style={{ fontSize: '11px', fontWeight: '700' }}>{currentUser ? 'Perfil' : 'Login'}</span>
            </button>
          </div>

          {/* Modal de Login */}
          {showLogin && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 9999, padding: '20px' }}>
              <div style={{ background: 'white', borderRadius: '16px', padding: '24px', width: '100%', maxWidth: '400px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                  <h3 style={{ fontSize: '20px', fontWeight: '900' }}>Iniciar sesión</h3>
                  <button onClick={() => setShowLogin(false)} style={{ background: 'none', border: 'none', fontSize: '24px', cursor: 'pointer' }}>×</button>
                </div>

                <input type="text" value={userName} onChange={(e) => setUserName(e.target.value)}
                  placeholder="Nombre (opcional)"
                  style={{ width: '100%', padding: '12px', marginBottom: '12px', borderRadius: '8px', border: '2px solid #E5E7EB', fontSize: '16px' }} />

                <input type="email" value={userEmail} onChange={(e) => setUserEmail(e.target.value)}
                  placeholder="Email"
                  onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                  style={{ width: '100%', padding: '12px', marginBottom: '16px', borderRadius: '8px', border: '2px solid #E5E7EB', fontSize: '16px' }} />

                <button onClick={handleLogin}
                  style={{ width: '100%', padding: '14px', background: '#3B82F6', color: 'white', border: 'none', borderRadius: '8px', fontSize: '16px', fontWeight: '900', cursor: 'pointer' }}>
                  Continuar
                </button>
              </div>
            </div>
          )}

          {/* Modal de Perfil */}
          {showProfile && currentUser && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 9999, padding: '20px', overflowY: 'auto' }}>
              <div style={{ background: 'white', borderRadius: '16px', padding: '24px', width: '100%', maxWidth: '600px', maxHeight: '90vh', overflowY: 'auto' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                  <h3 style={{ fontSize: '20px', fontWeight: '900' }}>Mi Perfil</h3>
                  <button onClick={() => setShowProfile(false)} style={{ background: 'none', border: 'none', fontSize: '24px', cursor: 'pointer' }}>×</button>
                </div>

                <div style={{ background: '#F3F4F6', padding: '12px', borderRadius: '8px', marginBottom: '20px' }}>
                  <p style={{ fontSize: '14px', color: '#6B7280', marginBottom: '4px' }}>Email</p>
                  <p style={{ fontSize: '16px', fontWeight: '700' }}>{currentUser.email}</p>
                </div>

                {/* Historial */}
                {history.length > 0 && (
                  <div style={{ marginBottom: '20px' }}>
                    <h4 style={{ fontSize: '16px', fontWeight: '900', marginBottom: '12px' }}>📍 Historial</h4>
                    <div style={{ maxHeight: '200px', overflowY: 'auto' }}>
                      {history.map(route => (
                        <div key={route.id} style={{ background: '#F9FAFB', padding: '12px', borderRadius: '8px', marginBottom: '8px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                          <div style={{ flex: 1 }}>
                            <p style={{ fontSize: '14px', fontWeight: '700', marginBottom: '4px' }}>{route.from} → {route.to}</p>
                            <p style={{ fontSize: '12px', color: '#6B7280' }}>{new Date(route.timestamp).toLocaleDateString()}</p>
                          </div>
                          <div style={{ display: 'flex', gap: '8px' }}>
                            <button onClick={() => toggleFavorite(route)}
                              style={{ background: 'none', border: 'none', fontSize: '20px', cursor: 'pointer' }}>
                              {favorites.some(f => f.id === route.id) ? '⭐' : '☆'}
                            </button>
                            <button onClick={() => loadRoute(route)}
                              style={{ background: '#3B82F6', color: 'white', border: 'none', padding: '6px 12px', borderRadius: '6px', fontSize: '12px', fontWeight: '700', cursor: 'pointer' }}>
                              Repetir
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Favoritos */}
                {favorites.length > 0 && (
                  <div style={{ marginBottom: '20px' }}>
                    <h4 style={{ fontSize: '16px', fontWeight: '900', marginBottom: '12px' }}>⭐ Favoritos</h4>
                    {favorites.map(route => (
                      <div key={route.id} style={{ background: '#FEF3C7', padding: '12px', borderRadius: '8px', marginBottom: '8px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <div style={{ flex: 1 }}>
                          <p style={{ fontSize: '14px', fontWeight: '700' }}>{route.from} → {route.to}</p>
                        </div>
                        <button onClick={() => loadRoute(route)}
                          style={{ background: '#F59E0B', color: 'white', border: 'none', padding: '6px 12px', borderRadius: '6px', fontSize: '12px', fontWeight: '700', cursor: 'pointer' }}>
                          Usar
                        </button>
                      </div>
                    ))}
                  </div>
                )}

                <button onClick={handleLogout}
                  style={{ width: '100%', padding: '14px', background: '#DC2626', color: 'white', border: 'none', borderRadius: '8px', fontSize: '16px', fontWeight: '900', cursor: 'pointer' }}>
                  Cerrar sesión
                </button>
              </div>
            </div>
          )}

          {/* Modal de Chat */}
          {showChat && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 9999, padding: '20px' }}>
              <div style={{ background: 'white', borderRadius: '16px', width: '100%', maxWidth: '600px', height: '80vh', display: 'flex', flexDirection: 'column' }}>
                <div style={{ padding: '16px', borderBottom: '2px solid #E5E7EB', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <h3 style={{ fontSize: '18px', fontWeight: '900' }}>💬 Asistente de Rutas</h3>
                  <button onClick={() => setShowChat(false)} style={{ background: 'none', border: 'none', fontSize: '24px', cursor: 'pointer' }}>×</button>
                </div>

                <div style={{ flex: 1, padding: '16px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '12px' }}>
                  {chatMessages.map((msg, idx) => (
                    <div key={idx} style={{ display: 'flex', justifyContent: msg.role === 'user' ? 'flex-end' : 'flex-start' }}>
                      <div style={{ maxWidth: '80%', padding: '10px 14px', borderRadius: '12px', background: msg.role === 'user' ? '#3B82F6' : '#F3F4F6', color: msg.role === 'user' ? 'white' : '#111827' }}>
                        <p style={{ fontSize: '14px' }}>{msg.content}</p>
                      </div>
                    </div>
                  ))}
                </div>

                <div style={{ padding: '16px', borderTop: '2px solid #E5E7EB', display: 'flex', gap: '8px' }}>
                  <input type="text" value={chatInput} onChange={(e) => setChatInput(e.target.value)}
                    onKeyPress={(e) => {
                      if (e.key === 'Enter' && chatInput.trim()) {
                        setChatMessages([...chatMessages, { role: 'user', content: chatInput }]);
                        setTimeout(() => {
                          setChatMessages(prev => [...prev, { role: 'assistant', content: '¡Excelente! Para ayudarte mejor, por favor usa el formulario de búsqueda arriba para calcular tu ruta.' }]);
                        }, 500);
                        setChatInput('');
                      }
                    }}
                    placeholder="Escribe tu mensaje..."
                    style={{ flex: 1, padding: '12px', borderRadius: '8px', border: '2px solid #E5E7EB', fontSize: '14px' }} />

                  <button onClick={() => {
                    if (chatInput.trim()) {
                      setChatMessages([...chatMessages, { role: 'user', content: chatInput }]);
                      setTimeout(() => {
                        setChatMessages(prev => [...prev, { role: 'assistant', content: '¡Excelente! Para ayudarte mejor, por favor usa el formulario de búsqueda arriba para calcular tu ruta.' }]);
                      }, 500);
                      setChatInput('');
                    }
                  }}
                    style={{ padding: '12px 16px', background: '#3B82F6', color: 'white', border: 'none', borderRadius: '8px', fontWeight: '900', cursor: 'pointer' }}>
                    Enviar
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
